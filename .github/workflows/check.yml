name: No-game-data workspace checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    name: Synthetic, types, and packages (Ubuntu)
    # Initial CI coverage is Linux only; do not imply a Windows matrix has passed.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      NUXT_TELEMETRY_DISABLED: '1'
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
    steps:
      - name: Check out wiki-data event revision
        uses: actions/checkout@v6
        with:
          path: Inteyvat-Wiki-data
          persist-credentials: false

      # Siblings use their default branches. Record actual SHAs below, not invented pins.
      - name: Check out resource-tools
        uses: actions/checkout@v6
        with:
          repository: Inteyvat-Wiki/resource-tools
          path: Inteyvat-Wiki-resource-tools
          persist-credentials: false

      - name: Check out wiki-contracts
        uses: actions/checkout@v6
        with:
          repository: Inteyvat-Wiki/wiki-contracts
          path: Inteyvat-Wiki-contracts
          persist-credentials: false

      - name: Check out GenshinData-scripts
        uses: actions/checkout@v6
        with:
          repository: Inteyvat-Wiki/GenshinData-scripts
          path: GenshinData-scripts
          persist-credentials: false

      - name: Check out genshin-db
        uses: actions/checkout@v6
        with:
          repository: Inteyvat-Wiki/genshin-db
          path: genshin-db
          persist-credentials: false

      - name: Check out Wiki and pinned server submodules
        uses: actions/checkout@v6
        with:
          repository: Inteyvat-Wiki/wiki
          path: Inteyvat-Wiki
          submodules: recursive
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Record checked-out revisions
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const folders = ['Inteyvat-Wiki-data', 'Inteyvat-Wiki-resource-tools',
            'Inteyvat-Wiki-contracts', 'GenshinData-scripts', 'genshin-db', 'Inteyvat-Wiki'];
          const lines = ['## Checked workspace revisions', '',
            'Ubuntu / Node.js 24 / .NET 8; synthetic and package checks only.', '',
            '| Checkout | Commit SHA |', '| --- | --- |'];
          for (const folder of folders) {
            const cwd = path.join(process.env.GITHUB_WORKSPACE, folder);
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { cwd, encoding: 'utf8' }).trim();
            lines.push(`| ${folder} | \`${sha}\` |`);
          }
          const submodules = execFileSync('git', ['submodule', 'status', '--recursive'], {
            cwd: path.join(process.env.GITHUB_WORKSPACE, 'Inteyvat-Wiki'), encoding: 'utf8',
          }).trimEnd();
          lines.push('', '### Wiki submodule revisions', '', '```text', submodules, '```', '');
          const report = lines.join('\n');
          console.log(report);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, report);
          if (!submodules || /^[-+U]/m.test(submodules)) throw new Error('Wiki submodules must be initialized at their pinned revisions.');

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # All local file: dependencies resolve to the sibling paths checked out above.
      # Missing/out-of-date lockfiles must fail npm ci; never fall back to npm install.
      - name: Install resource-tools dependencies
        working-directory: Inteyvat-Wiki-resource-tools
        run: npm ci

      - name: Install contracts dependencies
        working-directory: Inteyvat-Wiki-contracts
        run: npm ci

      - name: Build contracts before installing consumers
        working-directory: Inteyvat-Wiki-contracts
        run: npm run build

      - name: Install GenshinData-scripts dependencies
        working-directory: GenshinData-scripts
        run: npm ci

      - name: Install genshin-db dependencies
        working-directory: genshin-db
        run: npm ci

      - name: Install wiki-data dependencies
        working-directory: Inteyvat-Wiki-data
        run: npm ci

      - name: Install Wiki dependencies
        working-directory: Inteyvat-Wiki
        run: npm ci

      - name: Run workspace checks including package builds and integration
        working-directory: Inteyvat-Wiki-data
        run: npm run check:workspace
